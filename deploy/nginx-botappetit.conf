# Mini App: статика из /var/www/botappetit + проксирование /api на API внутри процесса бота.
# Установка: см. deploy/DEPLOY.md, раздел «Mini App: nginx и сертификат».
# Блок HTTPS (listen 443, ssl_certificate...) допишет `certbot --nginx -d botappetit.goida.root.sx`.

server {
    listen 80;
    listen [::]:80;
    server_name botappetit.goida.root.sx;

    root /var/www/botappetit;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;   # API_HOST:API_PORT из .env
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
