# Mini App: статика из /var/www/botappetit + проксирование /api на API внутри процесса бота.
# Установка и порядок действий: deploy/DEPLOY.md, раздел «Mini App: nginx и сертификат».
# Строки «managed by Certbot» — то, что certbot добавляет сам; сертификат выпускается отдельно
# (certbot certonly / certbot --nginx), пути ниже соответствуют домену botappetit.goida.root.sx.

server {
    listen 80;
    listen [::]:80;
    server_name botappetit.goida.root.sx;

    # http-01 проверка certbot при продлении сертификата (webroot-режим)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    server_name botappetit.goida.root.sx;

    root /var/www/botappetit;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;   # API_HOST:API_PORT из .env
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/botappetit.goida.root.sx/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/botappetit.goida.root.sx/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
